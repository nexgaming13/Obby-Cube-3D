
<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OBBY CUBE 3D</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    overflow: hidden;
    background: #78c9ff;
    font-family: Arial, sans-serif;
    color: white;
}

canvas {
    display: block;
}

#ui {
    position: fixed;
    inset: 0;
    pointer-events: none;
}

#logo {
    position: absolute;
    top: 18px;
    left: 20px;
    font-size: 25px;
    font-weight: 900;
    text-shadow: 0 3px 10px #234;
}

#stats {
    position: absolute;
    top: 18px;
    right: 20px;
    background: #111b;
    padding: 12px 18px;
    border-radius: 12px;
    line-height: 1.8;
}

#message {
    position: absolute;
    top: 40%;
    width: 100%;
    text-align: center;
    font-size: 30px;
    font-weight: bold;
    text-shadow: 0 3px 8px #222;
    pointer-events: auto;
}

#controls {
    position: absolute;
    bottom: 25px;
    left: 20px;
    display: flex;
    gap: 8px;
    pointer-events: auto;
}

#controls button, #jump {
    border: 0;
    border-radius: 15px;
    background: #17243cdd;
    color: white;
    font-size: 23px;
    width: 55px;
    height: 55px;
    touch-action: none;
}

#jump {
    position: absolute;
    bottom: 25px;
    right: 25px;
    pointer-events: auto;
    width: 85px;
    height: 85px;
    background: #713cff;
    font-size: 17px;
    font-weight: bold;
}

#help {
    position: absolute;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 12px;
    white-space: nowrap;
    text-shadow: 0 2px 5px black;
}

.action {
    padding: 13px 25px;
    background: #713cff;
    color: white;
    border: 0;
    border-radius: 10px;
    font-size: 17px;
    cursor: pointer;
    margin-top: 20px;
}

@media(max-width:600px) {
    #logo { font-size: 18px; }
    #stats { font-size: 13px; }
    #help { display: none; }
}
</style>
</head>

<body>

<div id="ui">

    <div id="logo">🟦 OBBY CUBE 3D</div>

    <div id="stats">
        💀 Śmierci: <span id="deaths">0</span><br>
        🪙 Monety: <span id="coins">0</span><br>
        🚩 Checkpoint: <span id="checkpoint">1</span>
    </div>

    <div id="message">
        OBBY CUBE 3D
        <br>
        <button class="action" onclick="startGame()">GRAJ</button>
    </div>

    <div id="controls">
        <button id="left">◀</button>
        <button id="right">▶</button>
        <button id="forward">▲</button>
        <button id="back">▼</button>
    </div>

    <button id="jump">SKOK</button>

    <div id="help">
        WASD / STRZAŁKI – RUCH · SPACJA – SKOK
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x78c9ff);
scene.fog = new THREE.Fog(0x78c9ff, 35, 100);

const camera = new THREE.PerspectiveCamera(
    70,
    innerWidth / innerHeight,
    0.1,
    200
);

const renderer = new THREE.WebGLRenderer({
    antialias: true
});

renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff, 0x526080, 2));

const sunlight = new THREE.DirectionalLight(0xffffff, 2);
sunlight.position.set(10, 20, 10);
sunlight.castShadow = true;
scene.add(sunlight);

const material = color =>
    new THREE.MeshStandardMaterial({ color });

const player = new THREE.Mesh(
    new THREE.BoxGeometry(1, 1, 1),
    material(0x713cff)
);

player.castShadow = true;
scene.add(player);

// PLATFORMY

const platforms = [];
const hazards = [];
const coins = [];

function platform(x, y, z, w, d, color) {

    const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(w, 0.6, d),
        material(color)
    );

    mesh.position.set(x, y, z);
    mesh.castShadow = true;
    mesh.receiveShadow = true;

    scene.add(mesh);

    platforms.push({
        x, y, z, w, d
    });

    return mesh;
}

function lava(x, y, z, w, d) {

    platform(x, y, z, w, d, 0xff2929);

    hazards.push({
        x, y, z, w, d
    });
}

function coin(x, y, z) {

    const mesh = new THREE.Mesh(
        new THREE.TorusGeometry(0.35, 0.09, 8, 20),
        new THREE.MeshStandardMaterial({
            color: 0xffdf36,
            emissive: 0x805000
        })
    );

    mesh.position.set(x, y, z);
    scene.add(mesh);

    coins.push(mesh);
}

// TRASA

platform(0, 0, 0, 8, 8, 0x37c96b);
platform(0, 0, -7, 4, 4, 0x20bfff);
platform(3, 1, -12, 3, 3, 0xffcc30);
platform(0, 2, -17, 3, 3, 0xff8c42);
platform(-3, 2, -22, 3, 3, 0xa66bff);
platform(-3, 1, -28, 5, 5, 0x37c96b);

lava(0, -2, -12, 5, 4);
lava(0, -2, -22, 5, 4);

coin(0, 1.5, -7);
coin(3, 2.5, -12);
coin(0, 3.5, -17);
coin(-3, 3.5, -22);

// META

const finish = new THREE.Group();

const pole = new THREE.Mesh(
    new THREE.CylinderGeometry(0.06, 0.06, 2, 8),
    material(0xffffff)
);

pole.position.y = 1;
finish.add(pole);

const flag = new THREE.Mesh(
    new THREE.BoxGeometry(1, 0.6, 0.08),
    material(0xffdf36)
);

flag.position.set(0.5, 1.6, 0);
finish.add(flag);

finish.position.set(-3, 1.3, -28);
scene.add(finish);

// STAN GRY

let spawn = { x: 0, y: 0.8, z: 0 };

let velocityY = 0;
let grounded = false;
let deaths = 0;
let score = 0;
let playing = false;
let won = false;

const keys = {};
const buttons = {};

window.addEventListener("keydown", e => {
    keys[e.key.toLowerCase()] = true;

    if (e.code === "Space") {
        e.preventDefault();
        jump();
    }
});

window.addEventListener("keyup", e => {
    keys[e.key.toLowerCase()] = false;
});

function bindButton(id, key) {

    const button = document.getElementById(id);

    button.addEventListener("pointerdown", e => {
        e.preventDefault();
        buttons[key] = true;
    });

    ["pointerup", "pointerleave", "pointercancel"].forEach(event => {
        button.addEventListener(event, () => {
            buttons[key] = false;
        });
    });
}

bindButton("left", "a");
bindButton("right", "d");
bindButton("forward", "w");
bindButton("back", "s");

document.getElementById("jump")
    .addEventListener("pointerdown", jump);

function startGame() {

    playing = true;
    won = false;

    player.position.set(spawn.x, spawn.y, spawn.z);
    velocityY = 0;

    document.getElementById("message").style.display = "none";
}

function jump() {

    if (playing && grounded && !won) {
        velocityY = 0.20;
        grounded = false;
    }
}

// KOLIZJE

function intersects(a, p) {

    return (
        Math.abs(a.x - p.x) < (p.w + 1) / 2 &&
        Math.abs(a.z - p.z) < (p.d + 1) / 2
    );
}

function resetPlayer() {

    deaths++;

    document.getElementById("deaths").textContent = deaths;

    player.position.set(spawn.x, spawn.y, spawn.z);

    velocityY = 0;
    grounded = false;
}

// GŁÓWNA PĘTLA

function animate() {

    requestAnimationFrame(animate);

    if (playing && !won) {

        let dx = 0;
        let dz = 0;

        if (keys["a"] || keys["arrowleft"] || buttons.a) dx--;
        if (keys["d"] || keys["arrowright"] || buttons.d) dx++;
        if (keys["w"] || keys["arrowup"] || buttons.w) dz--;
        if (keys["s"] || keys["arrowdown"] || buttons.s) dz++;

        const length = Math.hypot(dx, dz);

        if (length > 0) {
            player.position.x += dx / length * 0.12;
            player.position.z += dz / length * 0.12;
        }

        // GRAWITACJA

        const oldY = player.position.y;

        velocityY -= 0.006;
        player.position.y += velocityY;

        grounded = false;

        // LĄDOWANIE

        for (const p of platforms) {

            const insideX =
                Math.abs(player.position.x - p.x) < (p.w + 1) / 2;

            const insideZ =
                Math.abs(player.position.z - p.z) < (p.d + 1) / 2;

            const top = p.y + 0.3;

            const crossed =
                oldY - 0.5 >= top - 0.001 &&
                player.position.y - 0.5 <= top + 0.001;

            if (
                insideX &&
                insideZ &&
                crossed &&
                velocityY <= 0
            ) {

                player.position.y = top + 0.5;
                velocityY = 0;
                grounded = true;
            }
        }

        // LAVA

        for (const h of hazards) {

            if (
                intersects(player.position, h) &&
                player.position.y < h.y + 2
            ) {
                resetPlayer();
                break;
            }
        }

        // MONETY

        for (let i = coins.length - 1; i >= 0; i--) {

            const c = coins[i];

            c.rotation.y += 0.05;

            if (player.position.distanceTo(c.position) < 1.2) {

                scene.remove(c);
                coins.splice(i, 1);

                score++;

                document.getElementById("coins").textContent = score;
            }
        }

        // CHECKPOINT

        if (
            player.position.distanceTo(
                new THREE.Vector3(-3, 2, -28)
            ) < 2
        ) {

            spawn = {
                x: -3,
                y: 1.8,
                z: -28
            };

            document.getElementById("checkpoint").textContent = "2";
        }

        // SPADANIE

        if (player.position.y < -8) {
            resetPlayer();
        }

        // META

        if (
            player.position.z < -31 &&
            player.position.distanceTo(
                new THREE.Vector3(-3, 2, -28)
            ) < 4
        ) {

            won = true;

            document.getElementById("message").innerHTML = `
                🏆 WYGRAŁEŚ!
                <br>
                Zdobyte monety: ${score}
                <br>
                <button class="action" onclick="location.reload()">
                    ZAGRAJ PONOWNIE
                </button>
            `;

            document.getElementById("message").style.display = "block";
        }
    }

    // KAMERA

    const target = new THREE.Vector3(
        player.position.x,
        player.position.y + 2,
        player.position.z + 7
    );

    camera.position.lerp(target, 0.08);

    camera.lookAt(
        player.position.x,
        player.position.y,
        player.position.z - 2
    );

    renderer.render(scene, camera);
}

// START

player.position.set(0, 0.8, 0);

camera.position.set(0, 4, 8);
camera.lookAt(0, 0, 0);

window.addEventListener("resize", () => {

    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();

    renderer.setSize(innerWidth, innerHeight);
});

animate();

</script>

</body>
</html>
